<body>
  <h1>Pro $2.84/mo</h1>
  <p>Founding price, locked forever for early users. Less than 15% of ChatGPT Plus.</p>
  <p>Free: 3 tools and one audit. Pro: unlimited tools and audits, full savings details, export JSON, and cancel drafts.</p>
  <div class="card">
    <div id="paypal-button-container-P-6HT714478R159110WNLBOW4Q"></div>
  </div>
  <p><a href="/">← Back to app</a></p>

  <script src="https://www.paypal.com/sdk/js?client-id=AYJYO469TOgTLItVe-x2zk2hv-VgrHDVBe-_Blg9h9IPeiEl0Nzq1QrvJGxSQw4KwS6Q8SRhMNFIEIl1&vault=true&intent=subscription" data-sdk-integration-source="button-factory"></script>
  <script>
    paypal.Buttons({
      style: { shape: 'pill', color: 'gold', layout: 'vertical', label: 'paypal' },
      createSubscription: function(data, actions) {
        return actions.subscription.create({ plan_id: 'P-6HT714478R159110WNLBOW4Q' });
      },
      onApprove: async function(data) {
        try {
          localStorage.setItem('stackcut_sub_id', data.subscriptionID);
          localStorage.setItem('stackcut_pro', 'active');
          localStorage.setItem('stackcutify_pro', 'true');
          localStorage.setItem('isPro', 'true');
          if (globalThis.chrome?.storage?.sync) {
            await chrome.storage.sync.set({ isPro: true });
          }
        } catch (error) {
          alert('Payment approved, but Pro status could not be fully saved: ' + error.message);
          return;
        }
        alert('Pro activated! ID: ' + data.subscriptionID);
        window.location.href = '/?pro=1';
      }
    }).render('#paypal-button-container-P-6HT714478R159110WNLBOW4Q');
  </script>
