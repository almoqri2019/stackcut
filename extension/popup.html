<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stackcutify</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand-row">
          <div class="brand">stackcutify</div>
          <span id="proBadge" class="badge free">FREE</span>
        </div>
        <div id="summary" class="summary">$0/mo</div>
      </header>

      <main>
        <section id="proOffer" class="pro-offer">
          <strong>Pro $2.84/mo</strong>
          <p>Founding price, locked forever for early users. Less than 15% of ChatGPT Plus.</p>
          <button id="proUpgrade" type="button">Upgrade — $2.84/mo</button>
        </section>
        <section id="proActive" class="pro-active hidden" aria-live="polite">
          Pro Active — $2.84/mo locked
        </section>

        <div class="stats">
          <div class="card">
            <div class="label">Monthly burn</div>
            <div id="burn" class="value">$0</div>
          </div>
          <div class="card alt">
            <div class="label">Waste</div>
            <div id="waste" class="value">$0</div>
          </div>
        </div>

        <form id="toolForm" class="tool-form">
          <input id="toolName" type="text" placeholder="AI tool name" autocomplete="off" />
          <div class="row">
            <input id="toolPrice" type="number" min="0" step="0.01" placeholder="Price" />
            <select id="toolCycle">
              <option value="monthly">monthly</option>
              <option value="weekly">weekly</option>
              <option value="yearly">yearly</option>
              <option value="quarterly">quarterly</option>
            </select>
          </div>
          <select id="toolStatus">
            <option value="used">Used daily</option>
            <option value="weekly">Used weekly</option>
            <option value="forgot">Forgot / never used</option>
          </select>
          <button type="submit">Add tool</button>
        </form>
        <div id="freeBanner" class="free-banner hidden">Free limit: 3 tools. Go Pro for unlimited.</div>

        <div class="toolbar">
          <button id="importBtn" type="button" class="ghost">Import</button>
          <button id="exportBtn" type="button" class="ghost">Export</button>
        </div>
        <button id="openApp" type="button" class="ghost open-app">Open App</button>

        <div id="list" class="list"></div>
        <div id="message" class="message"></div>
      </main>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
